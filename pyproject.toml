[project]
name = "codepilot-agent"
version = "0.1.0"
description = "A minimal, source-readable LangGraph coding agent"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
  "langgraph>=0.2",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = ["httpx>=0.27", "pillow>=11.0", "pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]
